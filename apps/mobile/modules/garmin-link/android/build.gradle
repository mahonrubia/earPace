plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.pinganillo'
version = '0.1.0'

android {
  namespace "expo.modules.garminlink"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Connect IQ Mobile SDK oficial de Garmin (Maven Central).
  implementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.4.0@aar'
}
